# Argo WorkflowTemplate for distributed video trimming and merging.
#
# Architecture:
# - DAG pipeline:
#     1. `trim` (Parallel): Dynamically spawns 1 pod per segment via `withParam`.
#        Trims time ranges using stream copy (`-c copy`) without re-encoding.
#     2. `merge` (Sequential): Depends on `trim`. Concatenates all trimmed parts
#        into the final output video using FFmpeg's concat demuxer.
# - Storage: Mounts the shared host `/media` directory into `/video` in each pod.
# - Image: Uses `registry:5000/ffmpeg-worker:latest` from the in-cluster registry.
# - RBAC: Runs under `serviceAccountName: argo` (configured via `deploy/argo/workflow-rbac.yaml`).
#
# Parameters:
# - video: Source video filename in `/video` (e.g. "input.mp4")
# - output: Target merged video filename in `/video` (e.g. "output.mp4")
# - parts: Space-separated filenames of trimmed segment files (for the concat list)
# - segments: JSON array string of segments: '[{"start":0,"end":10,"output":"part-1.mp4"},...]'
#
# Apply:
#   kubectl apply -f deploy/argo/trim-merge.yaml

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: trim-merge
  namespace: argo
spec:
  entrypoint: trim-merge
  serviceAccountName: argo
  # parallelism: 4  # Unset intentionally: let Argo create all pods immediately so the Kubernetes
                    # scheduler manages the queue via Pending pods based on node resource requests.
  volumes:
    - name: media
      hostPath: { path: /media, type: Directory }
  arguments:
    parameters:
      - name: video
      - name: output
      - name: parts
      - name: segments
  templates:
    - name: trim-merge
      dag:
        tasks:
          - name: trim
            template: trim
            arguments:
              parameters:
                - name: start
                  value: "{{item.start}}"
                - name: end
                  value: "{{item.end}}"
                - name: output
                  value: "{{item.output}}"
            withParam: "{{workflow.parameters.segments}}"
          - name: merge
            dependencies: [trim]
            template: merge

    - name: trim
      inputs:
        parameters:
          - name: start
          - name: end
          - name: output
      container:
        image: registry:5000/ffmpeg-worker:latest
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        args:
          - |
            set -e
            ffmpeg -y -ss {{inputs.parameters.start}} -to {{inputs.parameters.end}} \
              -i /video/{{workflow.parameters.video}} -c copy /video/{{inputs.parameters.output}}
        volumeMounts: [{ name: media, mountPath: /video }]
        resources:
          requests: { cpu: 500m, memory: 256Mi }
          limits: { cpu: 1000m, memory: 512Mi }

    - name: merge
      container:
        image: registry:5000/ffmpeg-worker:latest
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        args:
          - |
            set -e
            cd /video
            LIST_FILE=$(mktemp /tmp/list.XXXXXX)
            trap 'rm -f "$LIST_FILE"' EXIT
            for f in {{workflow.parameters.parts}}; do
              echo "file '/video/$f'" >> "$LIST_FILE"
            done
            ffmpeg -y -f concat -safe 0 -i "$LIST_FILE" -c copy /video/{{workflow.parameters.output}}
        volumeMounts: [{ name: media, mountPath: /video }]
        resources:
          requests: { cpu: 500m, memory: 256Mi }
          limits: { cpu: 1000m, memory: 512Mi }